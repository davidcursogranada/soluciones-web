<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitio en Mantenimiento</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
        max-width: 600px;
        animation: fadeIn 1s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon {
        font-size: 100px;
        margin-bottom: 2rem;
        animation: rotate 3s linear infinite;
      }

      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        line-height: 1.6;
        opacity: 0.95;
      }

      .info-box {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 2rem;
        margin-top: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .contact {
        margin-top: 1.5rem;
        font-size: 1rem;
      }

      .contact a {
        color: #ffd700;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s ease;
      }

      .contact a:hover {
        color: #fff;
      }

      .loader {
        display: inline-block;
        margin-top: 1rem;
      }

      .loader span {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        margin: 0 5px;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .loader span:nth-child(1) {
        animation-delay: -0.32s;
      }

      .loader span:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }
        p {
          font-size: 1rem;
        }
        .icon {
          font-size: 70px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">⚙️</div>
      <h1>Estamos en Mantenimiento</h1>
      <p>
        Estamos trabajando para mejorar tu experiencia. Volveremos pronto con
        nuevas funcionalidades y mejoras.
      </p>

      <div class="info-box">
        <p style="margin-bottom: 0.5rem">🚀 Actualizando sistemas...</p>
        <div class="loader">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="contact">
          <p>Si necesitas ayuda urgente, contáctanos en:</p>
          <a href="mailto:contacto@tudominio.com">dersaq@gmail.Combinamos</a>
        </div>
      </div>
    </div>
  </body>
</html>
